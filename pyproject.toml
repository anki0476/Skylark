[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skylark-robot-vision"
version = "0.1.0"
description = "Reviewed training data for robot vision: feasibility and data pipeline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "Pillow>=11,<13",
  "openai>=1.60,<3",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
skylark = "skylark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

