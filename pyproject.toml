[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skylark-agent-lab"
version = "0.2.0"
description = "Reproduce tool failures and verify AI agent recovery"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "Pillow>=13,<14",
  "openai>=1.60,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "hypothesis>=6,<7"]

[project.scripts]
skylark = "skylark.wind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"skylark.wind" = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

