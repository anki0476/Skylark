name: Local beta verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKYLARK_LIVE_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m pip check
      - run: python -m pytest
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          SKYLARK_TEST_SERVER: '1'
          SKYLARK_TEST_PORT: '8000'
      - run: python scripts/release_smoke.py --output .cache/release-smoke
      - run: python scripts/package_release.py
      - run: python scripts/verify_release.py dist/skylark-local-beta.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: skylark-local-beta-${{ github.sha }}
          path: dist/skylark-local-beta.zip
          if-no-files-found: error
          retention-days: 60
          compression-level: 0
